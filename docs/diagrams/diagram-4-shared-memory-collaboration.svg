<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Shared Memory, Two-Person Collaboration</title>
<desc>Person A and their orchestrator on the left, person B and their orchestrator on the right, both reading status first and writing status last to a central shared git-tracked memory box containing backlog, epics, status, session log, and memory index.</desc>
<defs>
  <filter id="sk4" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n" seed="33"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
  </filter>
  <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a2b"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="540" fill="#f8f2e3"/>
<text x="450" y="38" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="24" fill="#33291e" font-weight="bold">The Files Are the Meeting</text>

<g filter="url(#sk4)">
  <rect x="40" y="200" width="190" height="100" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="670" y="200" width="190" height="100" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="290" y="120" width="320" height="280" rx="14" fill="#fffaf0" stroke="#33291e" stroke-width="3.5"/>

  <path d="M 230 240 C 250 235, 265 232, 288 228" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr4)"/>
  <path d="M 288 265 C 265 268, 250 270, 230 268" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr4)"/>
  <path d="M 670 240 C 650 235, 635 232, 612 228" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr4)"/>
  <path d="M 612 265 C 635 268, 650 270, 670 268" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr4)"/>
</g>

<text x="135" y="240" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-weight="bold">Person A +</text>
<text x="135" y="258" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-weight="bold">Orchestrator</text>

<text x="765" y="240" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-weight="bold">Person B +</text>
<text x="765" y="258" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-weight="bold">Orchestrator</text>

<text x="450" y="150" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Shared git-tracked memory</text>
<text x="450" y="185" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#5a4a35">Backlog · Epics · Status (next step)</text>
<text x="450" y="207" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#5a4a35">Session log · Memory index</text>

<text x="245" y="345" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#8a5a2b" font-style="italic">reads status first →</text>
<text x="245" y="365" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#8a5a2b" font-style="italic">← writes status last</text>

<text x="655" y="345" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#8a5a2b" font-style="italic">← reads status first</text>
<text x="655" y="365" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#8a5a2b" font-style="italic">writes status last →</text>

<text x="450" y="440" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-style="italic" font-weight="bold">"The files are the meeting."</text>
</svg>
