<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Orchestration Loop</title>
<desc>A human makes decisions and reports to an orchestrator. The orchestrator fans out to a research agent and two build agents, each in its own private git worktree. Build agents feed an independent review agent, which reports back to the orchestrator, which merges to the shared branch and reports back to the human.</desc>
<defs>
  <filter id="sk3" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n" seed="21"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
  </filter>
  <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a2b"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="560" fill="#f8f2e3"/>
<text x="450" y="38" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="24" fill="#33291e" font-weight="bold">The Orchestration Loop</text>

<g filter="url(#sk3)">
  <rect x="30" y="230" width="140" height="90" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="230" y="230" width="150" height="90" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="440" y="90" width="150" height="80" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="2.5"/>
  <rect x="440" y="230" width="150" height="80" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="2.5"/>
  <rect x="440" y="370" width="150" height="80" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="2.5"/>
  <rect x="660" y="230" width="180" height="90" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>

  <path d="M 170 260 C 195 250, 210 245, 228 255" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 380 260 C 405 220, 415 170, 438 135" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 380 270 C 405 270, 415 270, 438 270" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 380 285 C 405 330, 415 380, 438 405" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 590 270 C 620 270, 635 270, 658 270" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 660 250 C 500 150, 420 150, 385 230" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr3)"/>

  <path d="M 100 230 C 90 170, 100 120, 130 90" fill="none" stroke="#b5651d" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr3)"/>
</g>

<text x="450" y="70" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#5a4a35">reports / asks at forks</text>

<text x="100" y="270" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#8a5a2b" font-weight="bold">Human</text>
<text x="100" y="290" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">(decisions)</text>

<text x="305" y="270" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Orchestrator</text>
<text x="305" y="290" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="11" fill="#5a4a35">splits + delegates</text>

<text x="515" y="122" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#33291e" font-weight="bold">Research agent</text>
<text x="515" y="138" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="10" fill="#5a4a35">own worktree</text>

<text x="515" y="264" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#33291e" font-weight="bold">Build agent</text>
<text x="515" y="280" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="10" fill="#5a4a35">own worktree</text>

<text x="515" y="404" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#33291e" font-weight="bold">Build agent</text>
<text x="515" y="420" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="10" fill="#5a4a35">own worktree</text>

<text x="750" y="264" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-weight="bold">Review agent</text>
<text x="750" y="284" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="11" fill="#5a4a35">independent, then</text>
<text x="750" y="298" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="11" fill="#5a4a35">merge to shared branch</text>
</svg>
