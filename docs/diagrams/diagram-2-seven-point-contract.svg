<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Seven-Point Overnight Contract</title>
<desc>Seven questions to answer before letting an agent loop unattended: cadence, guardrails, scope, action, budget, stop conditions, and report.</desc>
<defs>
  <filter id="sketchy2" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="12"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5"/>
  </filter>
</defs>
<rect x="0" y="0" width="900" height="580" fill="#f8f2e3"/>
<text x="450" y="42" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#33291e" font-weight="bold">Before You Walk Away: 7 Questions</text>

<g filter="url(#sketchy2)">
  <rect x="105" y="90" width="150" height="160" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="285" y="90" width="150" height="160" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="465" y="90" width="150" height="160" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="645" y="90" width="150" height="160" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>

  <rect x="195" y="300" width="150" height="160" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="375" y="300" width="150" height="160" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="555" y="300" width="150" height="160" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
</g>

<text x="180" y="135" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#33291e" font-weight="bold">1. Cadence</text>
<text x="180" y="165" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">When does</text>
<text x="180" y="182" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">a tick fire?</text>

<text x="360" y="135" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#33291e" font-weight="bold">2. Guardrails</text>
<text x="360" y="165" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">What can never</text>
<text x="360" y="182" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">happen?</text>

<text x="540" y="135" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#33291e" font-weight="bold">3. Scope</text>
<text x="540" y="165" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">Where can it</text>
<text x="540" y="182" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">make changes?</text>

<text x="720" y="135" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#33291e" font-weight="bold">4. Action</text>
<text x="720" y="165" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">One step,</text>
<text x="720" y="182" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#5a4a35">then verify</text>

<text x="270" y="345" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#8a5a2b" font-weight="bold">5. Budget</text>
<text x="270" y="375" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">Cap agents</text>
<text x="270" y="392" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">&amp; tokens</text>

<text x="450" y="345" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#8a5a2b" font-weight="bold">6. Stop</text>
<text x="450" y="375" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">When to park</text>
<text x="450" y="392" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">and wait</text>

<text x="630" y="345" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="18" fill="#8a5a2b" font-weight="bold">7. Report</text>
<text x="630" y="375" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">What every tick</text>
<text x="630" y="392" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="12" fill="#6b4423">must say</text>

<text x="450" y="530" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="15" fill="#33291e" font-style="italic">Answer these once — the loop obeys them every single tick.</text>
</svg>
