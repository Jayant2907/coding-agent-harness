<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Read-First, Write-Last Ritual</title>
<desc>A flowchart: start a session, read Status, Backlog, and Decisions, verify the status against the actual code, do the work, then write updates back to Status, Session Log, and Backlog or Decisions if anything new came up, before the next session begins the same cycle.</desc>
<defs>
  <filter id="sk6" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n" seed="52"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
  </filter>
  <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a2b"/>
  </marker>
</defs>
<rect x="0" y="0" width="820" height="760" fill="#f8f2e3"/>
<text x="410" y="40" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="24" fill="#33291e" font-weight="bold">The Read-First, Write-Last Ritual</text>

<g filter="url(#sk6)">
  <rect x="310" y="70" width="200" height="70" rx="30" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="260" y="180" width="300" height="80" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="260" y="300" width="300" height="80" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="260" y="420" width="300" height="70" rx="12" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>
  <rect x="260" y="530" width="300" height="90" rx="12" fill="#fffaf0" stroke="#33291e" stroke-width="3"/>
  <rect x="310" y="660" width="200" height="70" rx="30" fill="#fdf0d8" stroke="#b5651d" stroke-width="3"/>

  <path d="M 410 140 L 410 178" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>
  <path d="M 410 260 L 410 298" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>
  <path d="M 410 380 L 410 418" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>
  <path d="M 410 490 L 410 528" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>
  <path d="M 410 620 L 410 658" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>

  <path d="M 260 400 C 120 400, 120 105, 305 100" fill="none" stroke="#b5651d" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arr6)"/>
  <path d="M 560 700 C 730 700, 730 105, 515 100" fill="none" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr6)"/>
</g>

<text x="410" y="110" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="17" fill="#33291e" font-weight="bold">New session starts</text>

<text x="410" y="215" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Read Status, Backlog,</text>
<text x="410" y="235" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Decisions first</text>

<text x="410" y="335" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Verify Status against</text>
<text x="410" y="355" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">the actual code</text>

<text x="410" y="460" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="17" fill="#8a5a2b" font-weight="bold">Do the work</text>

<text x="410" y="568" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">Write last: update Status,</text>
<text x="410" y="588" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">append Session Log,</text>
<text x="410" y="608" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#33291e" font-weight="bold">file new Backlog/Decisions</text>

<text x="410" y="700" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="17" fill="#33291e" font-weight="bold">Session ends</text>

<text x="100" y="400" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="13" fill="#b5651d" font-style="italic" transform="rotate(-90 100 400)">Status doesn't match reality</text>
<text x="700" y="400" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="14" fill="#8a5a2b" font-style="italic" transform="rotate(90 700 400)">next session, same cycle</text>
</svg>
